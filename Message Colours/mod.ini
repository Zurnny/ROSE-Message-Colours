[Mod]
Name=Message Colours
Version=1.3
Author=Zurnny
Group=
Description=Adds Message Colours to Options > Chat: pick a colour for each chat channel (chat, shout, whisper, trade, party, clan, group, quest and system). "Default" keeps the game's colour.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixed the "Could not retrieve element in view, was it destroyed?" warnings: the look that isn't in use is now hidden instead of taken out of the window.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Message-Colours/main/Message%20Colours/manifest.txt
