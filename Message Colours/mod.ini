Group=
Description=Adds Message Colours to the Add-ons window (the Add-ons button in the menu), under Chat: pick a colour for each chat channel (chat, shout, whisper, trade, party, clan, group, quest and system). "Default" keeps the game's colour.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixes a freeze when ticking a Dropped Items box in the Add-ons window. New: Group Leader colour in Message Colours; Minimap Window's compass ring with its own switch and map turning; Weapon Refresh merged into HUD Weapon Slot; the default UI Add-ons button uses the game's own button look.
Priority=5
