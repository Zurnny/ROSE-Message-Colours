Description=Adds Message Colours to the Add-ons window (the Add-ons button in the menu), under Chat: pick a colour for each chat channel (chat, shout, whisper, trade, party, clan, group, group leader, quest and system). "Default" keeps the game's colour.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Dropped Item Labels: the label background slider is in Options > Game again, under the game's own "Show dropped item name" (the copy of those tick boxes in the Add-ons window could not change the game's own).
Priority=5
